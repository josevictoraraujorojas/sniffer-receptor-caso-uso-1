name: Build firmware ESP-IDF

on:
  push:
    branches: [main, master, experimentos-tcc]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build ESP32 firmware
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py set-target esp32
          idf.py build
