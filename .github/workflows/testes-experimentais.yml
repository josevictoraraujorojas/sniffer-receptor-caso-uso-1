name: Testes experimentais

on:
  push:
    branches: [main, master, experimentos-tcc]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verificar sintaxe do validador
        run: python -m py_compile tests/validar_experimento.py
      - name: Executar autoteste offline
        run: python tests/validar_experimento.py --autoteste
